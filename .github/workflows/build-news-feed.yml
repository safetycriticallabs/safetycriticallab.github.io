# Rebuild SCL's own publication feed whenever /updates changes.
#
# Why this exists. news.json and feed.xml are generated from updates.html by
# generate_news.py. Anything generated by a command someone has to remember to
# run will drift from its source, and this pair drifts visibly: news.json fills
# the featured slot on /news and the six rows on the homepage, so a stale build
# means the site advertises an old release as the newest thing SCL has done.
#
# Scope is deliberately one generator. The other three (generate_faq.py,
# generate_glossary.py, generate_requirements.py) read faq.json and
# framework.json, which change rarely and produce very large diffs, and those
# should be looked at by a human before they ship. updates.html changes often
# and its diff is a handful of lines, so this one is safe to commit unattended.
#
# No loop. generate_news.py is idempotent, verified by running it twice against
# an unchanged tree and comparing hashes, so the commit this job makes produces
# no further changes on the next run. The actor guard below is a second line of
# defence rather than the mechanism.

name: Build news feed

on:
  push:
    branches: [main]
    paths:
      # updates.html is listed because the generator writes anchor ids back into
      # it for rows that do not have one yet.
      - 'updates.html'
      - 'generate_news.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-news-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # generate_news.py uses the standard library only, so there is nothing
      # to install.
      - name: Rebuild news.json and feed.xml
        run: python3 generate_news.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- news.json feed.xml updates.html; then
            echo "No change. Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json feed.xml updates.html
          git commit -m "Rebuild news feed from updates.html"
          git push
